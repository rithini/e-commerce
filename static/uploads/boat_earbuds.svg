<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_boat_earbuds" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#e50914" />
    </linearGradient>
    <linearGradient id="cardGrad_boat_earbuds" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow_boat_earbuds" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad_boat_earbuds)" />

  <!-- Ambient Glow -->
  <circle cx="90" cy="90" r="110" fill="#ff4b2b" opacity="0.22" filter="url(#glow_boat_earbuds)" />
  <circle cx="320" cy="310" r="130" fill="#ffffff" opacity="0.1" filter="url(#glow_boat_earbuds)" />

  <!-- Central Card Backdrop -->
  <rect x="40" y="40" width="320" height="320" rx="28" fill="url(#cardGrad_boat_earbuds)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Category Tag -->
  <rect x="65" y="65" width="115" height="26" rx="13" fill="#ffffff" opacity="0.18" />
  <text x="122" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">ELECTRONICS</text>

  <!-- Product Icon Graphic -->
  <g>
    
            <rect x="130" y="150" width="140" height="90" rx="35" fill="#1e1e1e" stroke="#ff4b2b" stroke-width="4"/>
            <line x1="130" y1="190" x2="270" y2="190" stroke="#ff4b2b" stroke-width="2"/>
            <circle cx="200" cy="190" r="10" fill="#00ff87"/>
            <rect x="155" y="110" width="18" height="42" rx="9" fill="#ffffff"/>
            <rect x="225" y="110" width="18" height="42" rx="9" fill="#ffffff"/>
        
  </g>

  <!-- Product Title Bar -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">boAt Airdopes 141</text>
</svg>