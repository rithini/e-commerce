<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_mens_shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <linearGradient id="cardGrad_mens_shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow_mens_shirt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad_mens_shirt)" />

  <!-- Ambient Glow -->
  <circle cx="90" cy="90" r="110" fill="#6dd5ed" opacity="0.22" filter="url(#glow_mens_shirt)" />
  <circle cx="320" cy="310" r="130" fill="#ffffff" opacity="0.1" filter="url(#glow_mens_shirt)" />

  <!-- Central Card Backdrop -->
  <rect x="40" y="40" width="320" height="320" rx="28" fill="url(#cardGrad_mens_shirt)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Category Tag -->
  <rect x="65" y="65" width="115" height="26" rx="13" fill="#ffffff" opacity="0.18" />
  <text x="122" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">FASHION</text>

  <!-- Product Icon Graphic -->
  <g>
    
            <path d="M140 135 L170 150 L200 135 L230 150 L260 135 L285 185 L250 195 L245 270 L155 270 L150 195 L115 185 Z" fill="#ffffff" stroke="#2a5298" stroke-width="4"/>
            <line x1="200" y1="135" x2="200" y2="270" stroke="#2a5298" stroke-width="3"/>
            <circle cx="200" cy="180" r="4" fill="#2a5298"/>
            <circle cx="200" cy="210" r="4" fill="#2a5298"/>
            <circle cx="200" cy="240" r="4" fill="#2a5298"/>
        
  </g>

  <!-- Product Title Bar -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Men's Cotton Casual Shirt</text>
</svg>