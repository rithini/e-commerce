<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_parker_pen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232526" />
      <stop offset="100%" stop-color="#414345" />
    </linearGradient>
    <linearGradient id="cardGrad_parker_pen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow_parker_pen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad_parker_pen)" />

  <!-- Ambient Glow -->
  <circle cx="90" cy="90" r="110" fill="#f1c40f" opacity="0.22" filter="url(#glow_parker_pen)" />
  <circle cx="320" cy="310" r="130" fill="#ffffff" opacity="0.1" filter="url(#glow_parker_pen)" />

  <!-- Central Card Backdrop -->
  <rect x="40" y="40" width="320" height="320" rx="28" fill="url(#cardGrad_parker_pen)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Category Tag -->
  <rect x="65" y="65" width="115" height="26" rx="13" fill="#ffffff" opacity="0.18" />
  <text x="122" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">ACCESSORIES</text>

  <!-- Product Icon Graphic -->
  <g>
    
            <polygon points="195,95 205,95 210,250 190,250" fill="#2c3e50" stroke="#f1c40f" stroke-width="2"/>
            <polygon points="190,250 210,250 200,285" fill="#f1c40f"/>
            <rect x="193" y="120" width="14" height="40" rx="3" fill="#f1c40f"/>
            <circle cx="200" cy="285" r="3" fill="#000000"/>
        
  </g>

  <!-- Product Title Bar -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Parker Vector Rollerball Pen</text>
</svg>