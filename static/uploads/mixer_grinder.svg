<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_mixer_grinder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>
    <linearGradient id="cardGrad_mixer_grinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow_mixer_grinder" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad_mixer_grinder)" />

  <!-- Ambient Glow -->
  <circle cx="90" cy="90" r="110" fill="#ffffff" opacity="0.22" filter="url(#glow_mixer_grinder)" />
  <circle cx="320" cy="310" r="130" fill="#ffffff" opacity="0.1" filter="url(#glow_mixer_grinder)" />

  <!-- Central Card Backdrop -->
  <rect x="40" y="40" width="320" height="320" rx="28" fill="url(#cardGrad_mixer_grinder)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Category Tag -->
  <rect x="65" y="65" width="115" height="26" rx="13" fill="#ffffff" opacity="0.18" />
  <text x="122" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">HOME & LIVING</text>

  <!-- Product Icon Graphic -->
  <g>
    
            <rect x="150" y="195" width="100" height="75" rx="16" fill="#ffffff" stroke="#11998e" stroke-width="4"/>
            <circle cx="200" cy="235" r="14" fill="#e74c3c"/>
            <path d="M160 195 L170 120 L230 120 L240 195 Z" fill="#b0bec5" stroke="#37474f" stroke-width="4"/>
            <path d="M235 140 Q260 160 238 180" fill="none" stroke="#37474f" stroke-width="6" stroke-linecap="round"/>
            <rect x="180" y="108" width="40" height="12" rx="4" fill="#37474f"/>
        
  </g>

  <!-- Product Title Bar -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Prestige Iris 750W Mixer</text>
</svg>