<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_denim_jeans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#3498db" />
    </linearGradient>
    <linearGradient id="cardGrad_denim_jeans" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow_denim_jeans" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad_denim_jeans)" />

  <!-- Ambient Glow -->
  <circle cx="90" cy="90" r="110" fill="#ecf0f1" opacity="0.22" filter="url(#glow_denim_jeans)" />
  <circle cx="320" cy="310" r="130" fill="#ffffff" opacity="0.1" filter="url(#glow_denim_jeans)" />

  <!-- Central Card Backdrop -->
  <rect x="40" y="40" width="320" height="320" rx="28" fill="url(#cardGrad_denim_jeans)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Category Tag -->
  <rect x="65" y="65" width="115" height="26" rx="13" fill="#ffffff" opacity="0.18" />
  <text x="122" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">FASHION</text>

  <!-- Product Icon Graphic -->
  <g>
    
            <rect x="150" y="115" width="100" height="25" rx="5" fill="#8d6e63"/>
            <path d="M150 140 L195 140 L190 270 L155 270 Z" fill="#2980b9" stroke="#ffffff" stroke-width="3"/>
            <path d="M205 140 L250 140 L245 270 L210 270 Z" fill="#2980b9" stroke="#ffffff" stroke-width="3"/>
            <line x1="170" y1="160" x2="185" y2="160" stroke="#ecf0f1" stroke-width="3"/>
            <line x1="215" y1="160" x2="230" y2="160" stroke="#ecf0f1" stroke-width="3"/>
        
  </g>

  <!-- Product Title Bar -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Roadster Stretch Jeans</text>
</svg>