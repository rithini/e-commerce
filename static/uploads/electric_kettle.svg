<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_electric_kettle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b134f" />
      <stop offset="100%" stop-color="#c94b4b" />
    </linearGradient>
    <linearGradient id="cardGrad_electric_kettle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow_electric_kettle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad_electric_kettle)" />

  <!-- Ambient Glow -->
  <circle cx="90" cy="90" r="110" fill="#fbc2eb" opacity="0.22" filter="url(#glow_electric_kettle)" />
  <circle cx="320" cy="310" r="130" fill="#ffffff" opacity="0.1" filter="url(#glow_electric_kettle)" />

  <!-- Central Card Backdrop -->
  <rect x="40" y="40" width="320" height="320" rx="28" fill="url(#cardGrad_electric_kettle)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Category Tag -->
  <rect x="65" y="65" width="115" height="26" rx="13" fill="#ffffff" opacity="0.18" />
  <text x="122" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">HOME & LIVING</text>

  <!-- Product Icon Graphic -->
  <g>
    
            <path d="M160 140 L240 140 L230 240 L165 240 Z" fill="#f5f5f5" stroke="#c94b4b" stroke-width="4"/>
            <rect x="155" y="240" width="90" height="14" rx="4" fill="#37474f"/>
            <path d="M235 155 Q265 190 230 225" fill="none" stroke="#37474f" stroke-width="7" stroke-linecap="round"/>
            <polygon points="150,150 162,145 162,170" fill="#c94b4b"/>
            <circle cx="200" cy="190" r="10" fill="#e74c3c"/>
        
  </g>

  <!-- Product Title Bar -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Pigeon 1.5L Electric Kettle</text>
</svg>