<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#3498db" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Ambient background glow circles -->
  <circle cx="90" cy="90" r="110" fill="#f1c40f" opacity="0.18" filter="url(#glow)" />
  <circle cx="320" cy="310" r="130" fill="#ffffff" opacity="0.08" filter="url(#glow)" />

  <!-- Central Card Backdrop -->
  <rect x="40" y="40" width="320" height="320" rx="28" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Category Tag -->
  <rect x="65" y="65" width="105" height="26" rx="13" fill="#ffffff" opacity="0.15" />
  <text x="117" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">ACCESSORIES</text>

  <!-- Product Icon Graphic -->
  <g>
    
            <path d="M130 180 Q160 165 190 180 L190 205 Q190 235 160 235 Q130 235 130 205 Z" fill="#1a252f" stroke="#f1c40f" stroke-width="4"/>
            <path d="M210 180 Q240 165 270 180 L270 205 Q270 235 240 235 Q210 235 210 205 Z" fill="#1a252f" stroke="#f1c40f" stroke-width="4"/>
            <line x1="190" y1="180" x2="210" y2="180" stroke="#f1c40f" stroke-width="5"/>
            <line x1="130" y1="180" x2="105" y2="175" stroke="#f1c40f" stroke-width="4"/>
            <line x1="270" y1="180" x2="295" y2="175" stroke="#f1c40f" stroke-width="4"/>
        
  </g>

  <!-- Product Title Bar -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Aviator Sunglasses</text>
</svg>