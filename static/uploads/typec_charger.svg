<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_typec_charger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#373b44" />
      <stop offset="100%" stop-color="#4286f4" />
    </linearGradient>
    <linearGradient id="cardGrad_typec_charger" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow_typec_charger" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad_typec_charger)" />

  <!-- Ambient Glow -->
  <circle cx="90" cy="90" r="110" fill="#f27121" opacity="0.22" filter="url(#glow_typec_charger)" />
  <circle cx="320" cy="310" r="130" fill="#ffffff" opacity="0.1" filter="url(#glow_typec_charger)" />

  <!-- Central Card Backdrop -->
  <rect x="40" y="40" width="320" height="320" rx="28" fill="url(#cardGrad_typec_charger)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Category Tag -->
  <rect x="65" y="65" width="115" height="26" rx="13" fill="#ffffff" opacity="0.18" />
  <text x="122" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">ELECTRONICS</text>

  <!-- Product Icon Graphic -->
  <g>
    
            <rect x="150" y="160" width="100" height="85" rx="16" fill="#ffffff" stroke="#4286f4" stroke-width="4"/>
            <rect x="175" y="125" width="14" height="35" rx="4" fill="#94a3b8"/>
            <rect x="211" y="125" width="14" height="35" rx="4" fill="#94a3b8"/>
            <rect x="180" y="215" width="40" height="12" rx="4" fill="#4286f4"/>
            <polygon points="198,175 190,195 200,195 195,210 210,190 200,190" fill="#f27121"/>
        
  </g>

  <!-- Product Title Bar -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Portronics 20W Fast Charger</text>
</svg>