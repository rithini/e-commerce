<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_orthopedic_pillow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1c71" />
      <stop offset="100%" stop-color="#d76d77" />
    </linearGradient>
    <linearGradient id="cardGrad_orthopedic_pillow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow_orthopedic_pillow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad_orthopedic_pillow)" />

  <!-- Ambient Glow -->
  <circle cx="90" cy="90" r="110" fill="#ffaf7b" opacity="0.22" filter="url(#glow_orthopedic_pillow)" />
  <circle cx="320" cy="310" r="130" fill="#ffffff" opacity="0.1" filter="url(#glow_orthopedic_pillow)" />

  <!-- Central Card Backdrop -->
  <rect x="40" y="40" width="320" height="320" rx="28" fill="url(#cardGrad_orthopedic_pillow)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Category Tag -->
  <rect x="65" y="65" width="115" height="26" rx="13" fill="#ffffff" opacity="0.18" />
  <text x="122" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">HOME & LIVING</text>

  <!-- Product Icon Graphic -->
  <g>
    
            <rect x="110" y="150" width="180" height="100" rx="30" fill="#ffffff" stroke="#ffaf7b" stroke-width="5"/>
            <path d="M130 190 Q200 160 270 190 Q200 220 130 190 Z" fill="#ffaf7b" opacity="0.3"/>
            <circle cx="200" cy="190" r="8" fill="#d76d77"/>
        
  </g>

  <!-- Product Title Bar -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Wakefit Orthopedic Pillow</text>
</svg>