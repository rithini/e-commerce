<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b134f" />
      <stop offset="100%" stop-color="#c94b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Ambient background glow circles -->
  <circle cx="90" cy="90" r="110" fill="#fbc2eb" opacity="0.18" filter="url(#glow)" />
  <circle cx="320" cy="310" r="130" fill="#ffffff" opacity="0.08" filter="url(#glow)" />

  <!-- Central Card Backdrop -->
  <rect x="40" y="40" width="320" height="320" rx="28" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Category Tag -->
  <rect x="65" y="65" width="105" height="26" rx="13" fill="#ffffff" opacity="0.15" />
  <text x="117" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">HOME & LIVING</text>

  <!-- Product Icon Graphic -->
  <g>
    
            <path d="M160 140 L240 140 L220 190 L180 190 Z" fill="#f5f5f5" stroke="#c94b4b" stroke-width="4"/>
            <rect x="175" y="190" width="50" height="12" rx="3" fill="#8d6e63"/>
            <path d="M170 202 L160 260 Q160 270 175 270 L225 270 Q240 270 240 260 L230 202 Z" fill="#ffffff" opacity="0.8" stroke="#c94b4b" stroke-width="3"/>
            <path d="M235 215 Q260 230 235 250" fill="none" stroke="#c94b4b" stroke-width="5" stroke-linecap="round"/>
        
  </g>

  <!-- Product Title Bar -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Ceramic Pour-Over</text>
</svg>